<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexDoc — Bank Statement PDF to Excel Converter</title>
    <style>:root{color:#0f172a;background:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}main{min-height:100vh;padding:40px 24px}.wrap{max-width:960px;margin:auto}.header{justify-content:space-between;align-items:center;margin-bottom:80px;display:flex}.brand{align-items:center;gap:12px;font-size:21px;font-weight:800;display:flex}.mark{color:#fff;background:#2563eb;border-radius:12px;place-items:center;width:38px;height:38px;display:grid}.muted{color:#64748b;font-size:14px}.grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:48px;display:grid}.eyebrow{color:#2563eb;font-weight:700}.hero h1{letter-spacing:-.04em;margin:16px 0;font-size:clamp(38px,6vw,64px);line-height:1.05}.hero p{color:#64748b;font-size:18px;line-height:1.7}.drop{cursor:pointer;text-align:center;background:#fff;border:2px dashed #bfdbfe;border-radius:24px;padding:40px 28px;box-shadow:0 18px 40px #0f172a14}.drop:hover{border-color:#2563eb}.icon{color:#2563eb;font-size:36px}.drop h2{margin:18px 0 8px}.drop p{color:#64748b;margin:0;font-size:14px}.drop button{color:#fff;background:#2563eb;border:0;border-radius:12px;margin-top:22px;padding:13px 20px;font-size:15px;font-weight:700}.secure{color:#64748b;margin-top:56px;font-size:14px}@media (width<=700px){main{padding:24px 18px}.header{align-items:flex-start;gap:12px;margin-bottom:56px}.header .muted{display:none}.grid{grid-template-columns:1fr;gap:36px}.hero h1{font-size:43px}.drop{padding:32px 20px}}</style>
  </head>
  <body>
    <main><div class="wrap">
      <header class="header"><div class="brand"><span class="mark">✦</span><span>ApexDoc</span></div><span class="muted">Bank statement converter</span></header>
      <section class="grid"><div class="hero"><div class="eyebrow">PDF to Excel, simplified</div><h1>Turn bank statements into clean spreadsheets.</h1><p>Upload a PDF and extract transactions into an organised Excel file in a few clicks.</p></div>
      <label class="drop"><input id="file" type="file" accept="application/pdf" hidden><div class="icon">↑</div><h2>Drop your PDF here</h2><p>or click to browse your files</p><p id="filename" style="color:#1d4ed8;font-weight:600;margin-top:16px"></p><button type="button">Choose PDF</button></label></section>
      <div class="secure">✓ Your files are processed securely.</div>
    </div></main>
    <script>document.getElementById('file').addEventListener('change',function(){document.getElementById('filename').textContent=this.files[0]?.name||''})</script>
  </body>
</html>
